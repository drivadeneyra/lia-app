<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIA</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LIA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="LIA: tu secretaria para estudiar en las horas que de verdad tienes libres.">
<meta name="theme-color" content="#3D3BF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
/* Layout: one-column phone app (max 440px) — scrolling view + fixed tab bar; sheets slide up from the bottom. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1C1B29; --mute:#6B6A7B; --line:#E6E2D9;
  --pri:#3D3BF3; --pri-ink:#FFFFFF; --pri-soft:#ECEBFF; --pri-sub:#C9C8FF;
  --clase:#E8EBF2; --clase-ink:#1C1B29; --trabajo:#FFE6BA; --trabajo-ink:#5A3B00;
  --otro:#E4F1EA; --otro-ink:#1F4D33; --exam:#FF5A4E; --exam-soft:#FFEFEC; --exam-ink:#B4271B;
  --ok:#1E9E5A; --ok-soft:#E3F7EC; --night:#16153A; --night-ink:#FFFFFF; --shadow:rgba(28,27,41,.10);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#7472FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --otro:#1D3327; --otro-ink:#A8E6C3; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121220; --surface:#1C1B2E; --ink:#EEEDF7; --mute:#A3A2B8; --line:#2D2C44;
  --pri:#7472FF; --pri-ink:#FFFFFF; --pri-soft:#26254A; --pri-sub:#D3D2FF;
  --clase:#26283A; --clase-ink:#E0E2EE; --trabajo:#3D2F14; --trabajo-ink:#FFD891;
  --otro:#1D3327; --otro-ink:#A8E6C3; --exam:#FF6F64; --exam-soft:#3A1E1E; --exam-ink:#FF9F97;
  --ok:#4CC98A; --ok-soft:#173326; --night:#0B0B19; --night-ink:#FFFFFF; --shadow:rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body.wm{background:#3D3BF3}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea,.bub{-webkit-user-select:text;user-select:text}
button,a,label{touch-action:manipulation}
button,.item,.ag,.day,.chip,.tab{transition:transform .12s ease,opacity .12s ease}
button:active:not(:disabled),.item:active,.ag:active,.chip:active{transform:scale(.97)}
.tab:active{transform:scale(.92)}
main.enter>*{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:8px}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:8px 6px;border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute);padding-block:4px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pri);font-weight:600}
.tab .av{width:40px;height:40px}
/* type */
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:600}
.kicker{font-size:13px;color:var(--mute);font-weight:500}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row-h{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.hero{background:var(--pri);color:var(--pri-ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:var(--pri-ink);opacity:.75}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.02em}
.note{background:var(--pri-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.note b{color:var(--pri)}
.warn{background:var(--exam-soft);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.warn b{color:var(--exam-ink)}
.night{background:var(--night);color:var(--night-ink);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.night .sub{opacity:.75;font-size:13px}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--pri);border-radius:14px;padding:10px 12px;font-size:13px}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:600;font-size:16px;padding:0 18px;width:100%}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.light{background:var(--surface);color:var(--pri)}
.btn.sec{background:var(--surface);color:var(--pri);border:1.5px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--exam-ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;width:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--pri-soft);color:var(--pri)}
.pill.solid{background:var(--pri);color:var(--pri-ink)}
.pill.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.dashed{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--pri);color:var(--pri);border-radius:16px;padding:10px 12px;font-weight:600;width:100%}
.dashed .grow{text-align:left}
.mic{width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.mic svg{width:18px;height:18px}
.ico{width:22px;height:22px;flex:none}
/* avatar */
.av{border-radius:50%;background:linear-gradient(135deg,#3D3BF3,#A855F7);display:grid;place-items:center;flex:none;color:#fff}
.av svg{width:55%;height:55%}
/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;width:100%}
.ag .t{font-size:13px;color:var(--mute);font-weight:500;padding-top:12px}
.blk{border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.blk b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.blk small{font-size:13px;opacity:.75}
.k-clase{background:var(--clase);color:var(--clase-ink)}
.k-trabajo{background:var(--trabajo);color:var(--trabajo-ink)}
.k-traslado,.k-otro{background:var(--otro);color:var(--otro-ink)}
.k-excepcion{background:repeating-linear-gradient(135deg,var(--clase) 0 8px,var(--surface) 8px 16px);color:var(--clase-ink);border:1px solid var(--line)}
.k-estudio{background:var(--pri);color:var(--pri-ink)}
.k-hecho{background:var(--ok-soft);color:var(--ok)}
.k-examen{background:var(--exam);color:#fff}
.k-dormir{background:var(--night);color:var(--night-ink)}
.past{opacity:.45}
/* lists */
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.sw{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.day span{font-size:12px;color:var(--mute);font-weight:500}
.day b{font-size:17px;font-weight:600}
.day[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.day[aria-pressed="true"] span{color:var(--pri-sub)}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.day[aria-pressed="true"] .dot{background:var(--pri-ink)}
.day .dot.x{background:var(--exam)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;color:var(--pri);font-weight:700}
.stat span{font-size:12px;color:var(--mute)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;max-width:84%;white-space:pre-line;display:flex;flex-direction:column;gap:8px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);border-radius:16px 16px 4px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.inbar{display:flex;gap:10px;align-items:center;padding-block:8px}
.inbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:13px 16px;font-size:16px}
.inbar .mic{width:48px;height:48px}
.inbar .mic svg{width:22px;height:22px}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:400;color:var(--ink);font-size:16px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpick label{display:grid;place-items:center;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink)}
.dpick input{position:absolute;opacity:0;pointer-events:none}
.dpick input:checked+span{color:var(--pri-ink)}
.dpick label:has(input:checked){background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.opt:has(input:checked){border-color:var(--pri)}
.opt input{accent-color:var(--pri);width:20px;height:20px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,25,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;
  padding-block:20px max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
/* full overlays */
.full{position:fixed;inset:0;z-index:40;background:var(--night);color:var(--night-ink);display:flex;justify-content:center}
.full .in{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.full .top{width:100%;display:flex;justify-content:space-between;font-size:14px;opacity:.75}
.full .glass{background:rgba(255,255,255,.08);border-radius:16px;padding:14px;width:100%;text-align:left;display:flex;gap:12px;align-items:center}
.halo{width:160px;height:160px;border-radius:50%;background:rgba(110,108,255,.12);display:grid;place-items:center;position:relative}
.halo::before{content:"";position:absolute;inset:20px;border-radius:50%;background:rgba(110,108,255,.25);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.halo .av{position:relative}
.transcript{font-size:21px;font-weight:600;line-height:1.3;min-height:56px}
.stopb{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center}
.stopb i{width:22px;height:22px;border-radius:5px;background:#FF5A4E}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .c b{font-size:52px;font-weight:700;letter-spacing:-.02em}
/* welcome */
.welcome{background:#3D3BF3;color:#fff;padding-block:20px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.welcome h1{font-size:32px;color:#fff}
.welcome .preview{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;color:#1C1B29}
.welcome .preview .k-clase{background:#E8EBF2;color:#1C1B29}.welcome .preview .k-trabajo{background:#FFE6BA;color:#5A3B00}.welcome .preview .k-estudio{background:#3D3BF3;color:#fff}
.welcome .btn.light{background:#fff;color:#3D3BF3}
.welcome .btn.ghostw{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.logo{display:flex;gap:8px;align-items:center;font-weight:700;font-size:20px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pri)}
.check{width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.check svg{width:14px;height:14px}
/* splash */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(120% 90% at 20% 10%,#5B59FF 0%,#3D3BF3 45%,#7A3FF0 100%);color:#fff;transition:opacity .4s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
.splash-in b{font-size:28px;letter-spacing:.12em}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
/* welcome carousel */
.obw{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;color:#fff;background:radial-gradient(120% 80% at 15% 0%,#5B59FF 0%,#3D3BF3 45%,#6A3CF2 80%,#8E4BF6 100%);
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.obw-top{display:flex;justify-content:space-between;align-items:center;padding:6px max(24px,env(safe-area-inset-left,0px)) 0}
.obw .logo svg{width:22px;height:22px}
.skip{color:#fff;opacity:.8;font-weight:600;font-size:15px;padding:8px}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;padding:0 28px;max-width:100%}
.art-wrap{flex:1;display:grid;place-items:center;min-height:0}
.copy{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.copy h1{color:#fff;font-size:30px}
.copy p{margin:0;opacity:.85;font-size:16px;line-height:1.45}
.obw-bottom{display:flex;flex-direction:column;gap:10px;padding:8px max(24px,env(safe-area-inset-left,0px)) 0}
.dots{display:flex;gap:8px;justify-content:flex-start;padding:4px 4px 10px}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.4);transition:width .25s ease,background .25s}
.dots button.on{width:24px;background:#fff}
.wbtn{background:#fff;color:#3D3BF3}
.wlink{color:#fff;opacity:.85;font-weight:600;padding:10px;text-align:center}
.art{position:relative;display:grid;place-items:center}
.art1{width:240px;height:240px}
.art1 .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.25)}
.art1 .r1{inset:0;animation:breathe 3s ease-in-out infinite}.art1 .r2{inset:36px;background:rgba(255,255,255,.08);animation:breathe 3s ease-in-out .4s infinite}
.art1 .av{box-shadow:0 16px 50px rgba(20,10,80,.45);border:3px solid rgba(255,255,255,.35)}
.bubble{position:absolute;right:-12px;top:22px;background:#fff;color:#1C1B29;font-weight:600;font-size:14px;padding:10px 14px;border-radius:16px 16px 16px 4px;box-shadow:0 10px 30px rgba(20,10,80,.3);animation:float 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);opacity:.7}}
@keyframes float{50%{transform:translateY(-6px)}}
.mini{width:min(300px,78vw);background:#fff;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px;color:#1C1B29;box-shadow:0 20px 60px rgba(20,10,80,.4);transform:rotate(-2deg)}
.mini .k-clase{background:#E8EBF2;color:#1C1B29}.mini .k-trabajo{background:#FFE6BA;color:#5A3B00}.mini .k-estudio{background:#3D3BF3;color:#fff;position:relative}
.slide[aria-hidden="false"] .mini .blk{animation:slidein .5s ease-out both}
.slide[aria-hidden="false"] .mini .blk:nth-of-type(2){animation-delay:.12s}.slide[aria-hidden="false"] .mini .blk:nth-of-type(3){animation-delay:.24s}.slide[aria-hidden="false"] .mini .blk:nth-of-type(4){animation-delay:.36s}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.flag{position:absolute;right:10px;top:-12px;background:#FFE6BA;color:#5A3B00;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;display:flex;gap:4px;align-items:center}
.flag svg{width:12px;height:12px}
.art3{gap:22px}
.micbig{width:112px;height:112px;border-radius:50%;background:#fff;color:#3D3BF3;display:grid;place-items:center;box-shadow:0 0 0 14px rgba(255,255,255,.12),0 0 0 30px rgba(255,255,255,.06),0 16px 50px rgba(20,10,80,.4)}
.micbig svg{width:48px;height:48px}
.wave{display:flex;gap:5px;align-items:center;height:52px}
.wave i{width:5px;border-radius:3px;background:#fff;opacity:.9;animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:scaleY(.4)}}
.moon{display:flex;gap:12px;align-items:center;background:rgba(10,8,40,.45);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 14px;font-size:13px;text-align:left}
.moon svg{width:22px;height:22px;color:#C9C8FF;flex:none}
/* setup */
.setup{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.setup-top{display:flex;align-items:center;gap:12px;padding:6px max(16px,env(safe-area-inset-left,0px))}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.progress{flex:1;display:flex;gap:6px}.progress i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}.progress i.on{background:var(--pri)}
.setup-body{flex:1;overflow-y:auto;padding:18px max(24px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:14px;max-width:480px;width:100%;margin:0 auto}
.setup-body.enter>*{animation:enter .35s ease-out both}
.setup-foot{padding:10px max(24px,env(safe-area-inset-left,0px)) 0;max-width:480px;width:100%;margin:0 auto}
.step-k{font-size:13px;font-weight:600;color:var(--pri)}
h1.q{font-size:30px;line-height:1.12}
.setup .muted{margin:0;font-size:16px}
.bigin{font-size:26px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;padding:12px 0;color:var(--ink);width:100%;border-radius:0;margin-top:10px}
.bigin:focus{outline:none;border-color:var(--pri)}
.timecards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:6px}
.tcard{min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tcard input{font-size:18px;font-weight:700;border:0;background:transparent;color:var(--ink);padding:0;width:100%;min-width:0}
.tic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}.tic svg{width:22px;height:22px}
.vcard{display:flex;gap:14px;align-items:center;background:var(--pri);color:var(--pri-ink);border-radius:20px;padding:16px;margin-top:4px}
.vmic{width:56px;height:56px;border-radius:50%;background:#fff;color:#3D3BF3;display:grid;place-items:center;flex:none;box-shadow:0 0 0 8px rgba(255,255,255,.15)}
.vmic svg{width:26px;height:26px}
.typeline{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px}
.typeline input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;color:var(--ink)}
.typeline input:focus{outline:none}
.typeline button{width:40px;height:40px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}.typeline button svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip svg{width:16px;height:16px;color:var(--pri)}
.build{justify-content:center}
.buildhead{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:6px}
.halo.sm{width:130px;height:130px}
.appear{animation:appear .45s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tdrop{from{opacity:0;margin-top:-12px}to{opacity:1;margin-top:0}}
/* chat extras */
.typing{flex-direction:row!important;gap:5px!important;padding:14px 16px!important}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.vtag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.vtag svg{width:14px;height:14px}
.inbar .iconbtn{flex:none;width:44px;height:44px}
.pill svg{width:14px;height:14px}
.full .wave{display:flex;gap:5px;align-items:center;height:52px}
.full .wave i{width:5px;border-radius:3px;background:#fff;opacity:.9;animation:wave 1s ease-in-out infinite}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));animation:tdrop .25s ease-out;z-index:50;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:14px;align-items:center;width:min(408px,calc(100% - 32px));font-size:14px;box-shadow:0 8px 24px var(--shadow)}
.toast button{color:var(--pri-sub);font-weight:700;white-space:nowrap}
:root[data-theme="light"] .toast button{color:#C9C8FF}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="splash" class="splash" aria-hidden="true"><div class="splash-in"><span class="av" style="width:96px;height:96px;box-shadow:0 12px 40px rgba(0,0,0,.25)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.1 6.2 6.4 2.3-6.4 2.3L12 19.5l-2.1-6.2L3.5 11l6.4-2.3L12 2.5z"/><path d="M19 16l.8 2.2 2.2.8-2.2.8L19 22l-.8-2.2-2.2-.8 2.2-.8L19 16z"/></svg></span><b>LIA</b></div></div>
<div class="app" id="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>

<script src="/lib/supabase.js"></script>
<script>
/*LOGIC-START*/
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0);};
const fmt=m=>{m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+':'+pad(m%60);};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff=(a,b)=>Math.round((fromYmd(b)-fromYmd(a))/864e5);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C=['D','L','M','M','J','V','S'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const EVAL_TYPES={parcial:{label:'Parcial',h:5,exam:true},final:{label:'Final',h:6,exam:true},practica:{label:'Práctica',h:3,exam:true},control:{label:'Control',h:2,exam:true},entrega:{label:'Entrega',h:4,exam:false},exposicion:{label:'Exposición',h:3,exam:false}};
const COMMIT_TYPES={clase:'Clases',trabajo:'Trabajo',traslado:'Traslado',otro:'Otro'};
const uid=()=>Math.random().toString(36).slice(2,9);
const hrs=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`;};
const fechaLarga=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;};
const fechaCorta=s=>{const d=fromYmd(s);return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;};

function subtract(wins,s,e){const out=[];for(const w of wins){if(e<=w.s||s>=w.e){out.push(w);continue;}if(s>w.s)out.push({s:w.s,e:s});if(e<w.e)out.push({s:e,e:w.e});}return out;}
function busyFor(state,date){const wd=fromYmd(date).getDay();const b=[];
  for(const c of state.commitments)if(c.days.includes(wd))b.push({s:toMin(c.start),e:toMin(c.end),kind:c.type,label:c.name,ref:c.id});
  for(const x of state.exceptions)if(x.date===date)b.push({s:toMin(x.start),e:toMin(x.end),kind:'excepcion',label:x.label,ref:x.id});
  return b;}
function evalDeadline(ev,S){const t=EVAL_TYPES[ev.type]||EVAL_TYPES.parcial;
  if(t.exam)return{date:ymd(addDays(fromYmd(ev.date),-1)),end:toMin(S.sleep)};
  return{date:ev.date,end:Math.min(toMin(ev.time)-60,toMin(S.sleep))};}
function doneFor(state,id){return state.done.filter(x=>x.evalId===id).reduce((a,x)=>a+x.min,0);}

// Motor de horarios: reparte las horas que pide cada evaluación en los huecos libres reales.
function plan(state,now){
  const S=state.settings,wake=toMin(S.wake),sleep=toMin(S.sleep);
  const today=ymd(now),nowMin=now.getHours()*60+now.getMinutes();
  const evs=state.evals.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  let last=ymd(addDays(now,6));for(const e of evs)if(e.date>last)last=e.date;
  const nDays=Math.min(dayDiff(today,last),60);const days={};
  for(let i=0;i<=nDays;i++){const d=ymd(addDays(fromYmd(today),i));let wins=[{s:wake,e:sleep}];
    if(i===0)wins=subtract(wins,0,Math.ceil((nowMin+10)/15)*15);
    for(const b of busyFor(state,d))wins=subtract(wins,b.s,b.e);
    for(const x of state.done)if(x.date===d)wins=subtract(wins,toMin(x.start),toMin(x.start)+x.min);
    for(const e of evs)if(e.date===d)wins=subtract(wins,toMin(e.time)-30,toMin(e.time)+120);
    days[d]={wins,load:0,free:wins.reduce((a,w)=>a+w.e-w.s,0)};}
  for(const x of state.done)if(days[x.date])days[x.date].load+=x.min;
  const blocks=[],unmet={};
  for(const ev of evs){
    let rem=Math.max(0,Math.round(ev.hours*60)-doneFor(state,ev.id));
    const dl=evalDeadline(ev,S);
    if(dl.date<today){unmet[ev.id]=ev.date<today?0:rem;continue;}
    const dlist=Object.keys(days).filter(d=>d<=dl.date).sort();
    const evLoad={};let progress=true;
    while(rem>=10&&progress){progress=false;
      for(const d of dlist){if(rem<10)break;const day=days[d];
        const avail=Math.min(S.maxDay-day.load,120-(evLoad[d]||0));
        if(avail<Math.min(S.minBlock,rem))continue;
        const limit=d===dl.date?dl.end:sleep;
        const need=Math.min(S.minBlock,rem);
        const cands=day.wins.map(w=>({s:w.s,e:Math.min(w.e,limit)})).filter(w=>w.e-w.s>=need);
        if(!cands.length)continue;
        cands.sort((a,b)=>(b.e-b.s)-(a.e-a.s)||a.s-b.s);
        const w=cands[0];let len=Math.min(S.block,rem,avail,w.e-w.s);
        len=Math.floor(len/5)*5;if(len<need)continue;
        let st=w.s;if(w.e-w.s>=len+180&&st<600)st=Math.min(600,w.e-len);
        blocks.push({evalId:ev.id,date:d,s:st,e:st+len});
        day.wins=subtract(day.wins,st,st+len+10);day.load+=len;evLoad[d]=(evLoad[d]||0)+len;rem-=len;progress=true;}}
    unmet[ev.id]=rem>=10?rem:0;}
  blocks.sort((a,b)=>(a.date+fmt(a.s)).localeCompare(b.date+fmt(b.s)));
  return{blocks,unmet,days};
}
function agendaFor(state,P,date){
  const it=[];const ev=id=>state.evals.find(e=>e.id===id);
  for(const b of busyFor(state,date))it.push({...b});
  for(const e of state.evals)if(e.date===date)it.push({s:toMin(e.time),e:toMin(e.time)+120,kind:'examen',label:`${EVAL_TYPES[e.type].label} · ${e.course}`,ref:e.id});
  for(const x of state.done)if(x.date===date){const e=ev(x.evalId);it.push({s:toMin(x.start),e:toMin(x.start)+x.min,kind:'hecho',label:`Estudiaste ${e?e.course:''}`,ref:x.id});}
  for(const b of P.blocks)if(b.date===date){const e=ev(b.evalId);it.push({s:b.s,e:b.e,kind:'estudio',label:`Estudiar ${e?e.course:''}`,sub:e?`Para: ${EVAL_TYPES[e.type].label} ${fechaCorta(e.date)}`:'',ref:b.evalId,block:b});}
  it.sort((a,b)=>a.s-b.s);return it;
}

// ---------- Lectura de frases (sin IA) ----------
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const DAYW={domingo:0,domingos:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,sabados:6};
const EVAL_KW={parcial:'parcial',parciales:'parcial',examen:'parcial',examenes:'parcial',final:'final',finales:'final',practica:'practica',pc:'practica',pc1:'practica',pc2:'practica',pc3:'practica',pc4:'practica',control:'control',quiz:'control',lab:'control',laboratorio:'control',entrega:'entrega',entrego:'entrega',entregar:'entrega',entregable:'entrega',exposicion:'exposicion',expongo:'exposicion',sustentacion:'exposicion',sustento:'exposicion'};
const COMMIT_KW={trabajo:'trabajo',trabajar:'trabajo',trabajando:'trabajo',chamba:'trabajo',chambeo:'trabajo',turno:'trabajo',clase:'clase',clases:'clase',traslado:'traslado',viaje:'traslado',gimnasio:'otro',gym:'otro',ingles:'otro',voluntariado:'otro',almuerzo:'otro',futbol:'otro',iglesia:'otro',academia:'otro'};
const NUMW={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
const MESN={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const TIMECTX=new Set(['las','la','de','a','desde','hasta','y','entre']);
function tokenize(text){
  const raw=text.replace(/[“”"¿?¡!]/g,' ').replace(/(\d)(am|pm|hrs|hr|h)\b/gi,'$1 $2').replace(/([ap])\.\s?m\.?/gi,'$1m').replace(/,/g,' , ').split(/\s+/).filter(Boolean);
  const toks=raw.map(o=>({o:o.replace(/[.;]+$/,''),n:norm(o).replace(/[.;]+$/,'')}));
  for(let i=0;i<toks.length;i++){const t=toks[i];if(NUMW[t.n]&&i>0&&TIMECTX.has(toks[i-1].n)){t.n=String(NUMW[t.n]);}}
  return toks;}
const H='(\\d{1,2})(?::(\\d{2}))?(?:\\s*(am|pm))?';
function partOf(ns){const m=ns.match(/\b(?:en|por|de|a) (?:la|las) (manana|tarde|noche)s?\b/)||ns.match(/\b(tarde|noche)s?\b/);return m?m[1]:null;}
function adj(h,m,ap,part){h=+h;m=+m||0;if(ap){if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;}
  else if((part==='tarde'||part==='noche')&&h<12)h+=12;else if(part!=='manana'&&h>=1&&h<=6)h+=12;return h*60+m;}
function parseTimes(ns){const part=partOf(ns);
  let m=ns.match(new RegExp(`\\b(?:de|desde|entre)\\s+(?:las\\s+|la\\s+)?${H}\\s+(?:a|hasta|y)\\s+(?:las\\s+|la\\s+)?${H}`));
  if(!m)m=ns.match(new RegExp(`\\b(\\d{1,2}):(\\d{2})(?:\\s*(am|pm))?\\s*(?:-|a|hasta)\\s*(\\d{1,2})(?::(\\d{2}))?(?:\\s*(am|pm))?`));
  if(m){let s=adj(m[1],m[2],m[3]||(m[6]==='pm'&&+m[1]<+m[4]?'pm':null),part),e=adj(m[4],m[5],m[6],part);
    if(e<=s&&e<720)e+=720;if(e>s)return{range:[s,e],part};}
  m=ns.match(new RegExp(`\\b(?:hasta(?:\\s+las|\\s+la)?|salgo\\b.{0,25}?\\ba(?:\\s+las|\\s+la)?)\\s+${H}`));
  if(m)return{until:adj(m[1],m[2],m[3],part),part};
  m=ns.match(new RegExp(`\\b(?:a las|a la|las)\\s+${H}`))||ns.match(/\b(\d{1,2}):(\d{2})(?:\s*(am|pm))?/)||ns.match(/\b(\d{1,2})\s*(am|pm)\b/);
  if(m){if(m.length===3)return{at:adj(m[1],0,m[2],part),part};return{at:adj(m[1],m[2],m[3],part),part};}
  return{part};}
function nextWeekday(now,wd,allowToday){let d=(wd-now.getDay()+7)%7;if(d===0&&!allowToday)d=7;return ymd(addDays(now,d));}
function parseDate(ns,now){
  if(/\bpasado manana\b/.test(ns))return ymd(addDays(now,2));
  const ns2=ns.replace(/\b(?:en|por|de|a) (?:la|las) mananas?\b/g,' ');
  if(/\bhoy\b/.test(ns2))return ymd(now);
  if(/\bmanana\b/.test(ns2))return ymd(addDays(now,1));
  let m=ns.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\b/);
  const mk=(d,mo)=>{let y=now.getFullYear();let dt=new Date(y,mo-1,d);if(dt<addDays(now,-1))dt=new Date(y+1,mo-1,d);return ymd(dt);};
  if(m)return mk(+m[1],+m[2]);
  m=ns.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/);
  if(m)return mk(+m[1],MESN[m[2]]);
  for(const [w,wd] of Object.entries(DAYW)){if(new RegExp(`\\b${w}\\b`).test(ns2)){const prox=new RegExp(`\\b(proximo|siguiente)\\s+${w}\\b`).test(ns2);let d=nextWeekday(now,wd,false);if(prox&&dayDiff(ymd(now),d)<7)d=ymd(addDays(fromYmd(d),7));return d;}}
  m=ns.match(/\bel (\d{1,2})\b(?!\s*(?::|am|pm|h\b|horas))/);
  if(m){const d=+m[1];let dt=new Date(now.getFullYear(),now.getMonth(),d);if(dt<addDays(now,-1))dt=new Date(now.getFullYear(),now.getMonth()+1,d);return ymd(dt);}
  return null;}
function parseDays(ns){
  if(/\b(todos los dias|diario|diariamente|cada dia)\b/.test(ns))return[0,1,2,3,4,5,6];
  if(/\bfin(?:es)? de semana\b/.test(ns))return[6,0];
  if(/\bentre semana\b/.test(ns))return[1,2,3,4,5];
  const dw='(lunes|martes|miercoles|jueves|viernes|sabado|domingo)s?';
  const m=ns.match(new RegExp(`\\b${dw}\\s+(?:a|al|hasta)\\s+(?:el\\s+)?${dw}\\b`));
  if(m){const a=DAYW[m[1]],b=DAYW[m[2]];const out=[];let d=a;for(let k=0;k<7;k++){out.push(d);if(d===b)break;d=(d+1)%7;}return out;}
  const out=[];for(const [w,wd] of Object.entries(DAYW))if(new RegExp(`\\b${w}\\b`).test(ns)&&!out.includes(wd))out.push(wd);
  return out.sort((a,b)=>((a+6)%7)-((b+6)%7));}
const STOPW=new Set(['el','la','los','las','a','y',',','hoy','manana','pasado','este','esta','proximo','proxima','siguiente','que','para','con','en','al','del','por','tengo','es','son','sera']);
const SKIPW=new Set(['de','del','en','el','la','mi','un','una','los','las','sobre','para','curso','curso:']);
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function extractCourse(toks,i){let j=i+1;while(j<toks.length&&SKIPW.has(toks[j].n))j++;const out=[];
  for(;j<toks.length&&out.length<4;j++){const t=toks[j];
    if(t.n==='de'&&out.length&&j+1<toks.length&&!STOPW.has(toks[j+1].n)&&toks[j+1].n!=='de'&&DAYW[toks[j+1].n]===undefined&&!/^\d/.test(toks[j+1].n)&&!MESN[toks[j+1].n]){out.push(t.o);continue;}
    if(STOPW.has(t.n)||t.n==='de'||DAYW[t.n]!==undefined||(EVAL_KW[t.n]&&!out.length)||MESN[t.n])break;
    if(/^\d/.test(t.n)){if(out.length&&/^\d$/.test(t.n)&&!(toks[j+1]&&/^(de|\/|am|pm|h|horas)$/.test(toks[j+1].n))){out.push(t.o);continue;}break;}
    if(/^(i|ii|iii|iv|v)$/.test(t.n)&&out.length){out.push(t.o.toUpperCase());continue;}
    out.push(t.o);}
  return cap(out.join(' '));}
function hasTime(ns){return /\d/.test(ns);}
function splitClauses(toks){const parts=[];let cur=[];
  for(let i=0;i<toks.length;i++){const t=toks[i];
    if(t.n==='y'||t.n===','){const lns=cur.map(x=>x.n).join(' ');const rns=toks.slice(i+1).map(x=>x.n).join(' ');
      const leftOk=hasTime(lns)||(cur.some(x=>EVAL_KW[x.n])&&parseDate(lns,new Date())!==null);
      const rightOk=/\d/.test(rns)||Object.keys(DAYW).some(w=>new RegExp(`\\b${w}\\b`).test(rns))||cur.length&&toks.slice(i+1).some(x=>EVAL_KW[x.n]||COMMIT_KW[x.n])||/\b(hoy|manana|tarde|noche)\b/.test(rns);
      if(cur.length&&leftOk&&rightOk){parts.push(cur);cur=[];continue;}
      if(!cur.length)continue;}
    cur.push(t);}
  if(cur.length)parts.push(cur);return parts;}
function parseClause(toks,now,prev,S){
  const ns=toks.map(t=>t.n).join(' ');
  const iE=toks.findIndex(t=>EVAL_KW[t.n]);
  const iC=toks.findIndex(t=>COMMIT_KW[t.n]);
  if(iE>=0){let k=iE;while(k+1<toks.length&&EVAL_KW[toks[k+1].n])k++;const type=EVAL_KW[toks[k].n];const course=extractCourse(toks,k)||(type==='entrega'?'Trabajo':'Curso');
    const date=parseDate(ns,now);const tm=parseTimes(ns);
    let time=tm.at!=null?fmt(tm.at):tm.range?fmt(tm.range[0]):(type==='entrega'?'23:59':'09:00');
    const hm=ns.match(/\b(\d{1,2})\s*(?:h|hrs|horas)\b/);
    const hours=hm?Math.min(+hm[1],40):EVAL_TYPES[type].h;
    if(!date)return{kind:'eval',error:`¿Qué día es tu ${EVAL_TYPES[type].label.toLowerCase()} de ${course}? Por ejemplo: “el jueves a las 9”.`};
    return{kind:'eval',type,course,date,time,hours};}
  if(iC>=0||(prev&&prev.kind==='commit'&&!prev.error)){
    const type=iC>=0?COMMIT_KW[toks[iC].n]:prev.type;
    const name=iC>=0?(type==='otro'?cap(toks[iC].o):COMMIT_TYPES[type]):prev.name;
    const days=parseDays(ns);const tm=parseTimes(ns);let range=tm.range;
    if(!range&&tm.part){range={manana:[540,780],tarde:[840,1080],noche:[1140,1320]}[tm.part];}
    if(!days.length)return{kind:'commit',type,name,error:`¿Qué días tienes ${name.toLowerCase()}? Por ejemplo: “de lunes a viernes de 3 a 7”.`};
    if(!range)return{kind:'commit',type,name,error:`¿A qué hora es ${name.toLowerCase()}? Por ejemplo: “de 3 a 7”.`};
    return{kind:'commit',type,name,days,start:fmt(range[0]),end:fmt(range[1])};}
  return null;}
// Devuelve una intención: {intent:'add',items}, {intent:'except',...}, {intent:'ask',...}, {intent:'help'}
function interpret(text,state,now){
  const toks=tokenize(text);const ns=toks.map(t=>t.n).join(' ');const S=state.settings;
  if(!ns.trim())return{intent:'help'};
  if(/\b(que tengo|que me toca|mi agenda|como esta mi)\b/.test(ns)){const d=parseDate(ns,now)||ymd(now);return{intent:'agenda',date:d};}
  if(/\b(cuanto me falta|cuantas horas|como voy)\b/.test(ns))return{intent:'progress'};
  if(/\b(cuando es|proximo examen|siguiente examen)\b/.test(ns))return{intent:'next'};
  const busyWords=/\b(me quedo|quedarme|salgo|no puedo|ocupad[oa]|me extendieron|turno extra|libera|liberame|tengo un compromiso|cancela|cancelaron|no voy a poder|no podre)\b/;
  const hasEval=toks.some(t=>EVAL_KW[t.n]);
  if(busyWords.test(ns)&&!hasEval){
    const date=parseDate(ns,now)||ymd(now);const tm=parseTimes(ns);const wake=toMin(S.wake),sleep=toMin(S.sleep);
    const nowMin=date===ymd(now)?now.getHours()*60+now.getMinutes():wake;
    let s,e,label='No disponible';
    if(tm.range){[s,e]=tm.range;}
    else if(tm.until!=null||(tm.at!=null&&/\b(salgo|me quedo|hasta)\b/.test(ns))){e=tm.until!=null?tm.until:tm.at;if(e<=Math.max(nowMin,wake)&&e<720)e+=720;
      const wd=fromYmd(date).getDay();const kind=/\bclase/.test(ns)?'clase':'trabajo';
      const c=state.commitments.filter(c=>c.days.includes(wd)&&(c.type===kind||c.type==='trabajo')&&toMin(c.end)<e).sort((a,b)=>toMin(b.end)-toMin(a.end))[0];
      s=c?toMin(c.end):Math.max(nowMin,wake);label=c?`${c.name} (más tarde)`:'Ocupado';}
    else if(tm.at!=null){s=tm.at;e=tm.at+60;}
    else{s=wake;e=sleep;label=/\blibera|liberame\b/.test(ns)?'Día libre':'Día ocupado';}
    if(!(e>s))return{intent:'help'};
    return{intent:'except',ex:{date,start:fmt(s),end:fmt(Math.min(e,24*60-1)),label}};}
  const clauses=splitClauses(toks);let prev=null;const items=[];
  for(const c of clauses){const r=parseClause(c,now,prev,S);if(r){items.push(r);prev=r;}}
  if(items.length)return{intent:'add',items};
  if(/\b(reorganiza|reprograma|arma|planifica|ordena)\b/.test(ns))return{intent:'replan'};
  return{intent:'help'};}
/*LOGIC-END*/

  if(s===2)return obShell(2,`<span class="step-k">Paso 2 de 4</span><h1 class="q">¿A qué hora duermes${state.settings.name?', '+esc(state.settings.name):''}?</h1><p class="muted">Lía nunca pondrá estudio en tus horas de sueño.</p>
    <div class="timecards"><label class="tcard"><span class="tic" style="background:var(--night);color:var(--pri-sub)">${I.moon}</span><span class="small muted">Me duermo</span><input type="time" id="ob-sleep" data-set="sleep" value="${state.settings.sleep}"></label>
    <label class="tcard"><span class="tic" style="background:var(--trabajo);color:var(--trabajo-ink)">${I.sun}</span><span class="small muted">Me despierto</span><input type="time" id="ob-wake" data-set="wake" value="${state.settings.wake}"></label></div>`,
    `<button class="btn pri" data-a="ob-next">Continuar</button>`);
  if(s===3)return obShell(3,`<span class="step-k">Paso 3 de 4</span><h1 class="q">¿Cuándo no puedes estudiar?</h1><p class="muted">Clases, trabajo, traslados. Lo registras una vez y se repite cada semana.</p>
    ${voiceCard('commit','“Trabajo de lunes a viernes de 3 a 7”')}
    <div class="chips">${[['clase','Clases'],['trabajo','Trabajo'],['traslado','Traslado'],['otro','Otro']].map(([k,l])=>`<button class="chip" data-a="chip-commit" data-type="${k}">${I.plus} ${l}</button>`).join('')}</div>
    <div class="stack">${state.commitments.map(commitItem).join('')}</div>`,
    state.commitments.length?`<button class="btn pri" data-a="ob-next">Continuar</button>`:`<button class="btn pri" data-a="ob-need" data-m="Agrega al menos un compromiso: clases o trabajo.">Continuar</button>`);
  if(s===4)return obShell(4,`<span class="step-k">Paso 4 de 4</span><h1 class="q">¿Qué exámenes y entregas se vienen?</h1><p class="muted">Lía calcula cuántas horas necesitas para cada uno.</p>
    ${voiceCard('eval','“Parcial de Cálculo el jueves a las 9”')}
    <div class="chips"><button class="chip" data-a="syllabus" data-from="syllabus-ob" style="border-color:var(--pri);color:var(--pri)">${I.clip} Subir mi sílabo</button>${['parcial','final','practica','entrega'].map(k=>`<button class="chip" data-a="chip-eval" data-type="${k}">${I.plus} ${EVAL_TYPES[k].label}</button>`).join('')}</div>
    <div class="stack">${state.evals.map(evalItem).join('')}</div>`,
    state.evals.length?`<button class="btn pri" data-a="ob-next">Armar mi horario</button>`:`<button class="btn pri" data-a="ob-need" data-m="Agrega al menos una evaluación.">Armar mi horario</button>`);
  const p=P();const tot=p.blocks.reduce((a,b)=>a+b.e-b.s,0);const falt=state.evals.filter(e=>p.unmet[e.id]>0);
  const lines=[`Registré ${state.commitments.length} compromiso${state.commitments.length===1?'':'s'} fijo${state.commitments.length===1?'':'s'}`,`Ordené ${state.evals.length} evaluaci${state.evals.length===1?'ón':'ones'} por fecha`,`Ubiqué ${hrs(tot)} de estudio en tus horas libres`,`Respeté tu trabajo, tus clases y tu sueño`,'Nada de estudio la noche antes de un examen'];
  return `<section class="setup"><div class="setup-body build">
    <div class="buildhead"><div class="halo sm">${AV(76)}</div><h1 class="q" style="text-align:center">Lía está armando tu semana…</h1></div>
    <div class="card stack">${lines.map((t,i)=>`<div class="row-h appear" style="animation-delay:${300+i*380}ms"><span class="check">${I.check}</span><span>${t}</span></div>`).join('')}</div>
    ${falt.length?`<div class="warn appear" style="animation-delay:2300ms"><span class="ico" style="color:var(--exam-ink)">${I.alert}</span><div class="small"><b>No me alcanza el tiempo para todo.</b><br>Me faltan ${falt.map(e=>`${hrs(p.unmet[e.id])} para ${esc(e.course)}`).join(', ')}. Puedes subir el máximo de estudio por día en Perfil.</div></div>`:''}
   </div><div class="setup-foot appear" style="animation-delay:2300ms"><button class="btn pri" data-a="ob-finish">Ver mi semana</button></div></section>`;}

function dictar(kind,ph){return `<form class="dashed" data-form="dictar" data-kind="${kind}" style="padding:6px 6px 6px 14px">
   <input id="dict-${kind}" name="q" placeholder="${esc(ph)}" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;color:var(--ink);padding:8px 0;font-weight:500;font-size:16px">
   <button type="button" class="mic" data-a="mic" data-target="dict-${kind}" aria-label="Dictar por voz">${I.mic}</button>
   <button type="submit" class="mic" aria-label="Agregar" style="background:var(--pri-soft);color:var(--pri)">${I.send}</button></form>`;}
function commitItem(c){return `<button class="item" data-a="edit-commit" data-id="${c.id}"><span class="sw k-${c.type}">${COMMIT_TYPES[c.type][0]}</span><span class="grow"><b>${esc(c.name)}</b><br><span class="small muted">${diasTxt(c.days)} · ${c.start} – ${c.end}</span></span><span class="tag muted">${hrs(c.days.length*(toMin(c.end)-toMin(c.start)))}</span></button>`;}
function diasTxt(ds){const s=[...ds].sort((a,b)=>((a+6)%7)-((b+6)%7));const k=s.join();
  if(k==='1,2,3,4,5')return'Lun a Vie';if(k==='1,2,3,4,5,6')return'Lun a Sáb';if(s.length===7)return'Todos los días';if(k==='6,0')return'Fines de semana';
  return s.map(d=>cap(DIAS[d].slice(0,3))).join(', ');}
function evalItem(e){const p=P();const need=e.hours*60,done=doneFor(state,e.id),pl=p.blocks.filter(b=>b.evalId===e.id).reduce((a,b)=>a+b.e-b.s,0);
  return `<button class="item" data-a="edit-eval" data-id="${e.id}" style="align-items:flex-start"><span class="sw ${swColor(e.type)}">${EVAL_TYPES[e.type].label[0]}</span><span class="grow stack" style="gap:6px"><span><b>${EVAL_TYPES[e.type].label} · ${esc(e.course)}</b><br><span class="small muted">${cap(fechaCorta(e.date))} · ${e.time} · ${done?`${hrs(done)} de ${hrs(need)} estudiadas`:`${hrs(need)} de estudio`}</span></span>
   <span class="bar"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></span>
   ${p.unmet[e.id]>0?`<span class="small" style="color:var(--exam-ink);font-weight:600">Faltan ${hrs(p.unmet[e.id])} sin hueco</span>`:pl?`<span class="small muted">${hrs(pl)} ya agendadas</span>`:''}</span><span class="tag" style="color:${tagColor(e.date)}">${enDias(e.date)}</span></button>`;}

function vHoy(){const n=now(),t=ymd(n),p=P(),nm=n.getHours()*60+n.getMinutes();
  const next=p.blocks.find(b=>b.date>t||b.e>nm);
  let hero;
  if(next){const e=evById(next.evalId);const when=next.date===t?(next.s>nm?`En ${hrs(next.s-nm)}`:'Ahora'):cap(fechaLarga(next.date));
    hero=`<section class="hero"><span class="eyebrow">Tu próximo bloque · ${esc(when)}</span><span class="big tnum">${fmt(next.s)} – ${fmt(next.e)}</span><span style="opacity:.9;font-weight:500">${esc(e.course)} · para tu ${EVAL_TYPES[e.type].label.toLowerCase()} del ${fechaCorta(e.date)}</span>
     <div style="height:6px"></div><button class="btn light" data-a="start" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">Empezar a estudiar</button>
     <button class="small" style="color:var(--pri-ink);opacity:.85;text-align:center;padding:6px" data-a="move" data-ev="${next.evalId}" data-d="${next.date}" data-s="${next.s}" data-e="${next.e}">¿No puedes a esa hora? Lía lo mueve</button></section>`;}
  else hero=`<section class="hero"><span class="eyebrow">Todo al día</span><span style="font-size:20px;font-weight:700">No tienes bloques de estudio pendientes.</span><span style="opacity:.85">Agrega tus próximas evaluaciones y Lía las reparte.</span><button class="btn light" data-a="add-eval">Agregar evaluación</button></section>`;
  const prox=state.evals.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
  let pc='';if(prox){const need=prox.hours*60,done=doneFor(state,prox.id),um=p.unmet[prox.id];
    pc=`<button class="card stack" data-a="tab" data-t="evals" style="text-align:left"><span class="between"><b>${EVAL_TYPES[prox.type].label} · ${esc(prox.course)}</b><span class="tag" style="color:${tagColor(prox.date)}">${enDias(prox.date)} ${prox.time}</span></span><span class="bar"><i style="width:${Math.min(100,Math.round(done/need*100))}%"></i></span><span class="small muted">${hrs(done)} de ${hrs(need)} estudiadas${um>0?` · <b style="color:var(--exam-ink)">faltan ${hrs(um)} sin hueco</b>`:' · el resto ya está en tu horario'}</span></button>`;}
  const tom=state.evals.find(e=>e.date===ymd(addDays(n,1)));
  const night=`<div class="night"><span class="ico" style="color:var(--pri-sub)">${I.moon}</span><div><b>Hoy duermes a las ${state.settings.sleep}</b><div class="sub">${tom?`Mañana tienes ${EVAL_TYPES[tom.type].label.toLowerCase()} de ${esc(tom.course)}. Con este plan llegas sin amanecerte.`:'Tu horario no te pide amanecerte.'}</div></div></div>`;
  const cf=conflicts()[0];
  const cfH=cf?`<div class="warn"><span class="ico" style="color:var(--exam-ink)">${I.alert}</span><div class="small"><b>Se te juntan ${fechaCorta(cf[0].date)} y ${fechaCorta(cf[1].date)}</b><br>${esc(cf[0].course)} y ${esc(cf[1].course)} van seguidos. Ya empecé a repartir el estudio desde antes.</div></div>`:'';
  return `${demoBanner()}<div><div class="kicker">${cap(fechaLarga(t))}</div><h1>${state.settings.name?`Hola, ${esc(state.settings.name)}`:'Hoy'}</h1></div>${hero}${cfH}${pc}<h2>Tu día</h2>${agendaHTML(t,p)}${night}`;}

function vSemana(){const n=now(),t=ymd(n),p=P();
  const mon=addDays(n,-((n.getDay()+6)%7)+7*ui.weekOffset);const days=[...Array(7)].map((_,i)=>ymd(addDays(mon,i)));
  if(!ui.sel||!days.includes(ui.sel))ui.sel=days.includes(t)?t:days[0];
  const study=days.reduce((a,d)=>a+p.blocks.filter(b=>b.date===d).reduce((x,b)=>x+b.e-b.s,0)+state.done.filter(x=>x.date===d).reduce((x,y)=>x+y.min,0),0);
  const exams=state.evals.filter(e=>days.includes(e.date)).length;
  const selStudy=p.blocks.filter(b=>b.date===ui.sel).reduce((x,b)=>x+b.e-b.s,0);
  const range=`${fromYmd(days[0]).getDate()} – ${fromYmd(days[6]).getDate()} de ${MESES[fromYmd(days[6]).getMonth()]}`;
  return `${demoBanner()}<div class="between"><div><div class="kicker">${range}</div><h1>Tu semana</h1></div><div class="row-h"><button class="pill ghost" data-a="wk" data-v="-1" aria-label="Semana anterior">${I.back.replace('<svg','<svg width="16" height="16"')}</button><button class="pill ghost" data-a="wk" data-v="1" aria-label="Semana siguiente">${I.next.replace('<svg','<svg width="16" height="16"')}</button></div></div>
  <div class="days">${days.map(d=>{const dt=fromYmd(d);const hasS=p.blocks.some(b=>b.date===d);const hasE=state.evals.some(e=>e.date===d);
    return `<button class="day ${d<t?'past':''}" data-a="sel" data-d="${d}" aria-pressed="${d===ui.sel}"><span>${DIAS_C[dt.getDay()]}</span><b class="tnum">${dt.getDate()}</b><i class="dot ${hasE?'x':''}" style="${hasS||hasE?'':'visibility:hidden'}"></i></button>`;}).join('')}</div>
  <div class="stats"><div class="card stat"><b class="tnum">${hrs(study)}</b><span>de estudio en esta semana</span></div><div class="card stat"><b class="tnum">${exams}</b><span>evaluaciones esta semana · 0 amanecidas</span></div></div>
  <div class="between"><h2>${cap(fechaLarga(ui.sel))}</h2><span class="small" style="color:var(--pri);font-weight:600">${selStudy?hrs(selStudy)+' de estudio':''}</span></div>
  ${agendaHTML(ui.sel,p)}`;}

function vEvals(){const t=ymd(now());const up=state.evals.filter(e=>e.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const past=state.evals.filter(e=>e.date<t);
  return `${demoBanner()}<div><div class="kicker">Exámenes y entregas</div><h1>Evaluaciones</h1></div>
  ${dictar('eval','Dímelo: “entrego el informe el viernes”')}
  <div class="stack">${up.map(evalItem).join('')||'<div class="card muted small">No tienes evaluaciones próximas.</div>'}
  <button class="dashed" data-a="add-eval">${I.plus.replace('<svg','<svg class="ico"')}<span class="grow">Agregar evaluación</span></button></div>
  ${past.length?`<h2>Pasadas</h2><div class="stack past">${past.map(evalItem).join('')}</div>`:''}`;}

function vLia(){const ph='Escríbele a Lía…';const on=liaOnline();
  const sug=['¿Qué tengo mañana?','Hoy salgo del trabajo a las 9','¿Cuánto me falta para mi próximo examen?','Libera mi sábado'];
  return `<div class="row-h">${AV(40)}<div class="grow"><b>Lía</b><div class="small" style="color:${on?'var(--ok)':'var(--mute)'}">${on?'Tu secretaria con IA · en línea':'Sin conexión · entiende frases simples'}</div></div></div>
  <div class="chat" id="chat">${state.chat.slice(-30).map((m,i,a)=>msgHTML(m,i===a.length-1)).join('')}${ui.pending?pendingHTML():''}${ui.thinking?`<div class="msg">${AV(28)}<div class="bub typing" aria-label="Lía está escribiendo"><i></i><i></i><i></i></div></div>`:''}</div>
  ${ui.thinking||ui.pending?'':`<div class="chips">${sug.map(s=>`<button class="pill ghost" data-a="chip" data-q="${esc(s)}">${esc(s)}</button>`).join('')}<button class="pill" data-a="syllabus" data-from="syllabus-chat">${I.clip} Subir sílabo</button></div>`}
  <form class="inbar" data-form="chat"><button type="button" class="iconbtn" data-a="syllabus" data-from="syllabus-chat" aria-label="Subir sílabo">${I.clip}</button><input id="chat-in" name="q" placeholder="${ph}" autocomplete="off" enterkeyhint="send"><button type="button" class="mic" data-a="mic" data-target="chat-in" aria-label="Hablar con Lía">${I.mic}</button></form>`;}
function msgHTML(m,last){return m.from==='me'?`<div class="msg me"><div class="bub">${m.voice?`<span class="vtag">${I.mic} Nota de voz</span>`:''}${m.file?`<span class="vtag">${I.clip} Archivo</span>`:''}${esc(m.text)}</div></div>`:`<div class="msg">${AV(28)}<div class="bub">${esc(m.text)}${m.undo&&last&&undoStack?`<button class="pill ghost" data-a="undo" style="align-self:flex-start">Deshacer</button>`:''}</div></div>`;}
function itemLine(it){if(it.kind==='eval')return `${EVAL_TYPES[it.type].label} · ${it.course} — ${fechaCorta(it.date)} ${it.time} (${it.hours} h de estudio)`;
  return `${it.name} — ${diasTxt(it.days)} · ${it.start} – ${it.end}`;}
function pendingHTML(){const it=ui.pending.items||[];const xs=ui.pending.exs||(ui.pending.ex?[ui.pending.ex]:[]);return `<div class="msg">${AV(28)}<div class="bub"><span class="eyebrow">¿Lo guardo?</span>${xs.map(x=>`<div class="blk k-excepcion"><b>${esc(x.label)}</b><small>${esc(cap(fechaCorta(x.date)))} · ${x.start} – ${x.end}</small></div>`).join('')}${it.map(i=>`<div class="blk ${i.kind==='eval'?(i.type==='entrega'?'k-trabajo':'k-examen'):'k-'+i.type}"><b>${esc(i.kind==='eval'?EVAL_TYPES[i.type].label+' · '+i.course:i.name)}</b><small>${esc(i.kind==='eval'?`${cap(fechaCorta(i.date))} · ${i.time} · ${i.hours} h de estudio`:`${diasTxt(i.days)} · ${i.start} – ${i.end}`)}</small></div>`).join('')}
   <div class="row-h"><button class="pill solid" data-a="confirm">Confirmar</button><button class="pill ghost" data-a="cancel">Corregir</button></div></div></div>`;}

function vPerfil(){const S=state.settings,p=P();const covered=state.evals.filter(e=>e.date>=ymd(now())&&!p.unmet[e.id]).length,up=state.evals.filter(e=>e.date>=ymd(now())).length;
  const studied=state.done.reduce((a,x)=>a+x.min,0);
  return `${demoBanner()}<div class="row-h"><span class="sw k-trabajo" style="width:52px;height:52px;border-radius:50%;font-size:18px">${esc((S.name||'Tú').slice(0,2).toUpperCase())}</span><div class="grow"><h1 style="font-size:22px">${esc(S.name||'Tu perfil')}</h1><div class="small muted">Estudias y trabajas · LIA versión de prueba</div></div></div>
  <div class="stats"><div class="card stat"><b class="tnum">${covered}/${up}</b><span>evaluaciones con tiempo de estudio completo</span></div><div class="card stat"><b class="tnum">${hrs(studied)}</b><span>estudiadas con LIA</span></div></div>
  <div class="between"><span class="eyebrow">Tu horario fijo</span><button class="pill" data-a="add-commit">${I.plus.replace('<svg','<svg width="14" height="14"')} Agregar</button></div>
  <div class="stack">${state.commitments.map(commitItem).join('')||'<div class="card small muted">Sin compromisos.</div>'}</div>
  <span class="eyebrow">Ajustes de Lía</span>
  <div class="card stack">
   <label class="f">Tu nombre<input id="set-name" data-set="name" value="${esc(S.name)}" placeholder="¿Cómo te llamas?"></label>
   <div class="two"><label class="f">Me despierto<input type="time" id="set-wake" data-set="wake" value="${S.wake}"></label><label class="f">Me duermo<input type="time" id="set-sleep" data-set="sleep" value="${S.sleep}"></label></div>
   <div class="two"><label class="f">Máximo de estudio al día<select id="set-max" data-set="maxDay">${[60,120,180,240,300,360].map(v=>`<option value="${v}" ${S.maxDay===v?'selected':''}>${hrs(v)}</option>`).join('')}</select></label>
   <label class="f">Duración del bloque<select id="set-block" data-set="block">${[45,60,90,120].map(v=>`<option value="${v}" ${S.block===v?'selected':''}>${hrs(v)}</option>`).join('')}</select></label></div>
   <span class="f" style="font-size:13px;font-weight:600;color:var(--mute)">¿Cuánta libertad le das a Lía?</span>
   <label class="opt"><input type="radio" name="aut" id="aut-auto" data-set="autonomy" value="auto" ${S.autonomy==='auto'?'checked':''}><span><b>Hazlo y avísame</b><br><span class="small muted">Lía mueve tus bloques y te cuenta qué cambió.</span></span></label>
   <label class="opt"><input type="radio" name="aut" id="aut-ask" data-set="autonomy" value="ask" ${S.autonomy==='ask'?'checked':''}><span><b>Pregúntame antes</b><br><span class="small muted">Lía te propone el cambio y tú apruebas.</span></span></label>
  </div>
  <span class="eyebrow">Tu cuenta</span>
  <div class="card stack small"><div class="between"><span class="muted">Correo</span><b style="overflow-wrap:anywhere;text-align:right">${esc(auth.email||'')}</b></div>
   <div class="between"><span class="muted">Guardado en la nube</span><b style="color:${sync.state==='error'?'var(--exam-ink)':sync.state==='offline'?'var(--trabajo-ink)':'var(--ok)'}">${syncLabel()}</b></div></div>
  ${installHTML()}
  <div class="stack"><button class="btn sec" data-a="ask-logout">Cerrar sesión</button><button class="btn danger" data-a="ask-reset">Borrar mis datos</button></div>`;}

// ---------- Hojas (formularios) ----------
const COMMIT_PRESET={clase:{name:'Clases',start:'08:00',end:'13:00'},trabajo:{name:'Trabajo',start:'15:00',end:'19:00'},traslado:{name:'Traslado',start:'19:00',end:'19:45'},otro:{name:'',start:'18:00',end:'19:00'}};
function sheetCommit(id,preset){const pr=preset?COMMIT_PRESET[preset]:null;const c=state.commitments.find(x=>x.id===id)||{id:'',name:pr?pr.name:'',type:preset||'trabajo',days:[1,2,3,4,5],start:pr?pr.start:'15:00',end:pr?pr.end:'19:00'};
  return `<form class="stack" data-form="commit" data-id="${c.id}" style="gap:14px"><div class="grab"></div><h2>${c.id?'Editar compromiso':'Nuevo compromiso'}</h2>
  <label class="f">Nombre<input id="c-name" name="name" required value="${esc(c.name)}" placeholder="Trabajo, Clases, Gimnasio…"></label>
  <label class="f">Tipo<select id="c-type" name="type">${Object.entries(COMMIT_TYPES).map(([k,v])=>`<option value="${k}" ${c.type===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <div class="f">Días<div class="dpick">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="d" value="${d}" ${c.days.includes(d)?'checked':''}><span>${DIAS_C[d]}</span></label>`).join('')}</div></div>
  <div class="two"><label class="f">Desde<input type="time" id="c-start" name="start" required value="${c.start}"></label><label class="f">Hasta<input type="time" id="c-end" name="end" required value="${c.end}"></label></div>
  <button class="btn pri" type="submit">Guardar</button>${c.id?`<button class="btn danger" type="button" data-a="del-commit" data-id="${c.id}">Eliminar</button>`:''}<button class="btn sec" type="button" data-a="close">Cancelar</button></form>`;}
function sheetEval(id,preset){const t=ymd(addDays(now(),3));const ty=preset||'parcial';const e=state.evals.find(x=>x.id===id)||{id:'',type:ty,course:'',date:t,time:ty==='entrega'?'23:59':'09:00',hours:EVAL_TYPES[ty].h};

const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(fromYmd(s));
const validTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);

  return up.find(e=>nrm(e.course)===q)||up.find(e=>nrm(e.course).includes(q)||q.includes(nrm(e.course)))||null;}
function buildContext(){const n=now(),S=state.settings,p=P(),t=ymd(n);const L=[];

  for(const c of state.commitments)L.push(`- ${c.name} (${c.type}): ${diasTxt(c.days)} ${c.start}-${c.end}`);
  L.push('Evaluaciones:');const evs=state.evals.filter(e=>e.date>=ymd(addDays(n,-3))).sort((a,b)=>a.date.localeCompare(b.date));if(!evs.length)L.push('- (ninguna)');
  for(const e of evs)L.push(`- ${EVAL_TYPES[e.type].label} · ${e.course}: ${DIAS[fromYmd(e.date).getDay()]} ${e.date} ${e.time}; necesita ${e.hours} h; ya estudió ${hrs(doneFor(state,e.id))}; ${p.unmet[e.id]>0?'faltan '+hrs(p.unmet[e.id])+' sin hueco libre':'tiempo de estudio cubierto'}`);
  L.push('Agenda calculada por la app para los próximos 7 días:');
  for(let i=0;i<7;i++){const d=ymd(addDays(n,i));const it=agendaFor(state,p,d);L.push(`- ${DIAS[fromYmd(d).getDay()]} ${d}: ${it.map(x=>`${fmt(x.s)}-${fmt(x.e)} ${x.label}`).join('; ')||'libre'}`);}
  return L.join('\n');}
const liaOnline=()=>!!(sb&&auth.uid&&navigator.onLine);
async function callLia(payload){
  if(!sb||!auth.uid)throw{userMsg:'Inicia sesión para hablar con Lía.'};
  if(!navigator.onLine)throw{userMsg:'Sin conexión. Lía necesita internet para entenderte.',offline:true};
  const n=now();
  const body={text:payload.text||'',audio:payload.audio||null,file:payload.file||null,today:ymd(n),weekday:DIAS[n.getDay()],
    time:fmt(n.getHours()*60+n.getMinutes()),context:buildContext(),history:payload.history||[]};

  const {data,error}=res;
  if(error){const st=error.context&&error.context.status;let msg='Lía no está disponible en este momento. Inténtalo en un rato.';
    if(st===404)msg='Lía todavía no está instalada en el servidor.';
    else if(st===429)msg='Lía recibió muchas consultas hoy. Vuelve a intentarlo en un rato.';
    else if(st===401)msg='Tu sesión venció. Cierra sesión y vuelve a entrar.';
    else if(st===413)msg='El archivo es muy grande. Prueba con uno más liviano o con una foto.';
    else if(!st)msg='No pude conectarme con Lía. Revisa tu internet.';
    try{const j=await error.context.json();if(j&&j.error&&/GEMINI_API_KEY/.test(j.error))msg='Falta configurar la clave de Gemini en Supabase.';}catch(e){}

  return data;}
function liaActions(res){const items=[],exs=[],ops=[];

    if(a.type==='add_eval'&&validDate(a.date)){const ty=EVAL_TYPES[a.eval_type]?a.eval_type:'parcial';
      items.push({kind:'eval',type:ty,course:String(a.course||'Curso').trim().slice(0,60)||'Curso',date:a.date,time:validTime(a.time)?a.time:(ty==='entrega'?'23:59':'09:00'),hours:Math.min(40,Math.max(.5,+a.hours||EVAL_TYPES[ty].h))});}

      const days=[...new Set(a.days.map(Number).filter(d=>d>=0&&d<=6))];if(!days.length)continue;const k=COMMIT_TYPES[a.kind]?a.kind:'otro';

function movesMsg(p0,exs){const p1=P();const days=new Set(exs.map(x=>x.date));
  const lost=p0.blocks.filter(b=>exs.some(x=>x.date===b.date&&b.s<toMin(x.end)&&b.e>toMin(x.start)));

function applyAll(items,exs,ops){const p0=P();snapshot();

  const notes=[];
  for(const a of ops||[]){const e=findEvalByCourse(a.course);if(!e){notes.push(`No encontré la evaluación de ${a.course||'ese curso'}.`);continue;}
    if(a.type==='delete_eval'){state.evals=state.evals.filter(x=>x.id!==e.id);state.done=state.done.filter(x=>x.evalId!==e.id);}
    else{const min=Math.min(600,Math.max(5,Math.round(+a.minutes||30)));const n=now();state.done.push({id:uid(),evalId:e.id,date:ymd(n),start:fmt(Math.max(0,n.getHours()*60+n.getMinutes()-min)),min});}}
  save();return movesMsg(p0,exs)+(notes.length?' '+notes.join(' '):'');}
async function askLia(payload,from){
  // from: 'chat' | 'commit' | 'eval' | 'syllabus-chat' | 'syllabus-ob'
  const inChat=from==='chat'||from==='syllabus-chat';
  if(inChat){if(payload.text)state.chat.push({from:'me',text:payload.text});if(payload.file)state.chat.push({from:'me',text:`Sílabo: ${payload.file.name||'archivo'}`,file:true});
    ui.thinking=true;ui.pending=null;save();if(ui.tab!=='lia'){ui.tab='lia';}render();}
  else ui.busy=true,toast(payload.file?'Lía está leyendo tu sílabo…':'Lía está entendiendo…');
  const history=inChat?state.chat.slice(-10,-1).filter(m=>!m.file).map(m=>({from:m.from,text:m.text})):[];
  let res;
  try{res=await callLia({...payload,history});}
  catch(e){ui.thinking=false;ui.busy=false;
    if(payload.text&&e.offline){ if(inChat)state.chat.pop(); handleText(payload.text,from==='chat'?'chat':from); return;}
    if(inChat){liaSay(e.userMsg||'Algo falló. Inténtalo de nuevo.');render();}else{toast(e.userMsg||'Algo falló. Inténtalo de nuevo.');}
    return;}
  ui.thinking=false;ui.busy=false;
  if(payload.audio&&res.transcript&&inChat)state.chat.push({from:'me',text:String(res.transcript).slice(0,500),voice:true});
  const {items,exs,ops}=liaActions(res);
  const reply=(res.reply||'').trim();
  if(!inChat){ // registro inicial y campos de dictado: se aplica directo, con deshacer
    if(!items.length&&!exs.length){toast(reply||'No te entendí. Inténtalo con otras palabras.');rerenderKeepScroll();return;}
    applyAll(items,exs,ops);rerenderKeepScroll();
    toast(items.length?`Lía agregó: ${items.map(i=>i.kind==='eval'?i.course:i.name).join(', ')}`:reply,true);return;}
  const needConfirm=items.length>0||(exs.length>0&&state.settings.autonomy==='ask');
  if(needConfirm){liaSay(reply||'Esto es lo que entendí. ¿Lo guardo?');ui.pending={items,exs,ops};render();return;}
  if(exs.length||ops.length){const extra=applyAll([],exs,ops);liaSay((reply||'Listo.')+extra,{undo:true});render();return;}
  liaSay(reply||'No te entendí bien. ¿Me lo dices de otra forma?');render();}

// ---------- Grabar audio (funciona en Android y iPhone, instalada o no) ----------
let mediaRec=null,recChunks=[],recStream=null,recTick=null;
const MAX_REC=30;
async function startRecording(target){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder||!liaOnline()){startMic(target);return;}
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast(e&&e.name==='NotAllowedError'?'LIA necesita permiso para usar el micrófono. Actívalo en los ajustes del navegador.':'No se pudo usar el micrófono de este teléfono.');return;}
  recChunks=[];try{mediaRec=new MediaRecorder(recStream);}catch(e){recStream.getTracks().forEach(t=>t.stop());startMic(target);return;}
  mediaRec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  mediaRec.onstop=onRecStop;mediaRec.start(250);haptic();
  ui.listen={target,rec:true,phase:'rec',t0:Date.now(),use:false};render();
  clearInterval(recTick);recTick=setInterval(()=>{if(!ui.listen||!ui.listen.rec){clearInterval(recTick);return;}
    const s=Math.floor((Date.now()-ui.listen.t0)/1000);const el=document.getElementById('rec-time');if(el)el.textContent=`0:${pad(s)} / 0:${MAX_REC}`;
    if(s>=MAX_REC)stopRecording(true);},250);}
function stopRecording(use){if(!ui.listen||!ui.listen.rec)return;ui.listen.use=use;clearInterval(recTick);
  try{if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();}catch(e){}try{recStream&&recStream.getTracks().forEach(t=>t.stop());}catch(e){}
  if(use){ui.listen.phase='think';render();}}
async function onRecStop(){const L=ui.listen;if(!L||!L.use){ui.listen=null;render();return;}
  const target=L.target;const from=target==='chat-in'?'chat':target==='dict-commit'?'commit':'eval';
  try{const blob=new Blob(recChunks,{type:(mediaRec&&mediaRec.mimeType)||'audio/webm'});
    if(blob.size<1500)throw new Error('corto');
    const wav=await toWav16k(blob);const data=await blobToB64(wav);ui.listen=null;render();
    await askLia({audio:{mime:'audio/wav',data}},from);}
  catch(e){ui.listen=null;render();toast(e&&e.message==='corto'?'No escuché nada. Mantén el teléfono cerca y vuelve a intentar.':'No pude procesar el audio. Inténtalo de nuevo o escríbelo.');}}
async function toWav16k(blob){const buf=await blob.arrayBuffer();const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
  const audio=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);});try{ac.close();}catch(e){}
  const rate=16000,len=Math.max(1,Math.ceil(audio.duration*rate));const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const oac=new OAC(1,len,rate);const src=oac.createBufferSource();src.buffer=audio;src.connect(oac.destination);src.start(0);
  const out=await new Promise((res,rej)=>{oac.oncomplete=e=>res(e.renderedBuffer);const p=oac.startRendering();if(p&&p.then)p.then(res,rej);});
  const d=out.getChannelData(0);const b=new ArrayBuffer(44+d.length*2);const v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+d.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++){const x=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7FFF,true);}
  return new Blob([b],{type:'audio/wav'});}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});}

async function onSyllabusFile(file){if(!file)return;
  if(file.size>4.5*1024*1024){toast('El archivo pesa más de 4.5 MB. Prueba con una foto o un PDF más liviano.');return;}
  const ok=/pdf$/i.test(file.type)||/^image\//.test(file.type)||/\.pdf$/i.test(file.name);if(!ok){toast('Sube un PDF o una foto del sílabo.');return;}
  const data=await blobToB64(file);
  await askLia({file:{mime:file.type||'application/pdf',data,name:file.name}},state.onboarded?sylFrom:'syllabus-ob');}

let rec=null;
function startMic(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback=()=>{ui.listen=null;render();const el=document.getElementById(target);if(el)el.focus();toast('Para dictar, toca el micrófono de tu teclado y habla.');};
  if(!SR){fallback();return;}

    rec.onresult=e=>{ui.listen&&(ui.listen.text=Array.from(e.results).map(r=>r[0].transcript).join(''));const l=document.getElementById('live');if(l&&ui.listen)l.textContent=ui.listen.text;};
    rec.onerror=e=>{rec=null;if(e.error==='no-speech'){ui.listen=null;render();toast('No te escuché. Inténtalo de nuevo.');}else fallback();};
    rec.onend=()=>{if(ui.listen){const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;render();if(t)submitVoice(tg,t);}};
    rec.start();}catch(e){fallback();}}
function stopMic(useIt){if(!ui.listen)return;const t=ui.listen.text,tg=ui.listen.target;ui.listen=null;try{rec&&(rec.onend=null,rec.stop());}catch(e){}rec=null;render();if(useIt&&t)submitVoice(tg,t);}
